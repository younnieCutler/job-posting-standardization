<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JDF — 로컬 파이프라인 아키텍처</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1120px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      margin-bottom: 0.4rem;
    }
    .sub {
      font-size: 0.9rem; color: var(--color-muted);
      line-height: 1.5; max-width: 60ch; margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · JDF 7차시</p>
    <h1>로컬 파이프라인 — 두 트랙</h1>
    <p class="sub">합성 트랙(표기 흔들림 정리 검증)과 실제 공개 ATS 트랙(시장 표본)은 별개로 흐르고, Streamlit 리포트에서만 나란히 읽힌다. 클라우드 계층은 <a href="cloud-architecture.html">cloud-architecture.html</a>.</p>

    <svg viewBox="0 0 1040 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jdf-local-pipeline-title jdf-local-pipeline-desc">

        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <rect x="52" y="92" width="132" height="12" rx="2" fill="#f5f5f5"/>
      <text x="118" y="101" fill="rgba(45,49,66,0.42)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">합성 트랙 (Kafka)</text>

      <rect x="32" y="284" width="712" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="52" y="288" width="164" height="12" rx="2" fill="#f5f5f5"/>
      <text x="134" y="297" fill="rgba(45,49,66,0.42)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">공개 ATS 트랙 (실데이터)</text>

      <line x1="344" y1="260" x2="344" y2="316" stroke="rgba(45,49,66,0.45)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <path d="M 728,148 H 764 Q 772,148 772,156 V 216 Q 772,224 780,224 H 816" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="754" y="178" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="772" y="187" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

      <rect x="48" y="220" width="344" height="40" rx="6" fill="#f5f5f5"/>

      <rect x="56" y="226" width="26" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="69" y="235" fill="rgba(45,49,66,0.7)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DAG</text>
      <text x="230" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Airflow — collect → normalize 순서 지휘</text>

      <text x="904" y="270" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">첫 화면 데이터셋 택1</text>

      <!-- ============ LEGEND (bottom strip) ============ -->
      <line x1="32" y1="524" x2="1008" y2="524" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

  </div>
</body>
</html>
