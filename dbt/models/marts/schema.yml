version: 2

models:
  - name: stg_postings
    description: canonical 공고 타입 캐스팅 + 스킬 태그 배열
    columns:
      - name: posting_id
        description: source_platform + source_posting_id 의 sha256. 두 트랙 공통 키
        data_tests: [unique, not_null]

  - name: mart_tech_demand
    description: 스킬 태그별 공고 수
    columns:
      - name: skill
        data_tests: [unique, not_null]
      - name: postings
        data_tests: [not_null]

  - name: mart_platform_dist
    description: 플랫폼별 공고 수 + 스킬 태그 부착률
    columns:
      - name: source_platform
        data_tests: [unique, not_null]

  - name: mart_overview
    description: 리포트 헤더 스코어카드 (1행)
  - name: mart_seniority_dist
    description: 직무 분야 × 경력 수준별 공고 수
  - name: mart_salary_format
    description: 급여 표기 방식 분포 (정규화 대상)
    columns:
      - name: salary_type
        data_tests: [unique, not_null]
  - name: mart_company_activity
    description: 채용 활발 기업 상위 20
    columns:
      - name: company_name
        data_tests: [unique, not_null]
  - name: mart_monthly_intake
    description: 월별 공고 유입 (posted_at 있는 건만)
    columns:
      - name: posted_month
        data_tests: [unique, not_null]

  - name: stg_ats_postings
    description: Public ATS 공고 정리 + 본문 기술 키워드 배열
    columns:
      - name: posting_id
        data_tests: [unique, not_null]
  - name: mart_ats_company
    description: 공고 많이 관측된 기업 상위 20 (Public ATS)
    columns:
      - name: company_name
        data_tests: [unique, not_null]
  - name: mart_ats_location
    description: 근무 지역별 공고 수 상위 20 (Public ATS)
  - name: mart_ats_department
    description: 부서별 공고 수 상위 20 (Public ATS)
  - name: mart_ats_skill_demand
    description: 본문 기술 키워드별 공고 수 (Public ATS)
  - name: mart_ats_overview
    description: Page 1 ATS 블록 스코어카드
